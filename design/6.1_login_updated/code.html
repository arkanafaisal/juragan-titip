<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login - JuraganTitip</title>

    <link href="https://fonts.googleapis.com" rel="preconnect" />

        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#d3e4fe",
                        "tertiary-container": "#007d55",
                        "on-error": "#ffffff",

                        "destructive": "350 89% 60%",
                        "surface": "0 0% 100%",
                        "surface-container-low": "#eff4ff",
                        "on-tertiary-container": "#bdffdb",
                        "secondary-fixed": "#e9ddff",
                        "primary": "221 83% 53%",
                        "secondary-container": "#8455ef",
                        "surface-elevated": "0 0% 100%",
                        "surface-variant": "#d3e4fe",
                        "primary-fixed-dim": "#b4c5ff",
                        "success": "161 64% 39%",
                        "on-secondary-fixed": "#23005c",
                        "on-background": "#0b1c30",
                        "on-tertiary-fixed": "#002113",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#d0bcff",
                        "inverse-primary": "#b4c5ff",
                        "surface-container": "#e5eeff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#00174b",
                        "tertiary": "#006242",
                        "on-secondary-fixed-variant": "#5516be",
                        "outline": "#737686",
                        "warning": "38 92% 50%",
                        "surface-container-high": "#dce9ff",
                        "error-container": "#ffdad6",
                        "outline-variant": "#c3c6d7",
                        "info": "262 83% 66%",
                        "text-secondary": "215 16% 47%",
                        "on-secondary-container": "#fffbff",
                        "on-error-container": "#93000a",
                        "background": "210 40% 98%",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-secondary": "#ffffff",
                        "text-muted": "215 20% 65%",
                        "on-primary-fixed-variant": "#003ea8",
                        "secondary": "#6b38d4",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-surface": "#0b1c30",
                        "surface-bright": "#f8f9ff",
                        "primary-container": "#2563eb",

                        "surface-tint": "#0053db"
                    },
                    "borderRadius": {

                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {

                        "md": "16px",
                        "container-max": "1280px",
                        "gutter": "12px",

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Hide default password reveal eye in Edge/IE */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }
    </style>
</head>

<body class="bg-background min-h-screen flex items-center justify-center p-md text-on-surface antialiased">
    <!-- Login Canvas -->
    <main class="w-full max-w-[400px]">
        <!-- Glassmorphism Card -->
        <div
            class="bg-surface rounded-xl shadow-sm border border-outline-variant p-5 flex flex-col gap-lg relative overflow-hidden">
            <!-- Subtle Top Accent Line -->
            <div class="absolute top-0 left-0 w-full h-1 bg-primary-container"></div>
            <!-- Branding Header -->
            <div class="flex flex-col items-center text-center mt-sm">
                <div
                    class="w-12 h-12 rounded-lg bg-surface-container-high text-primary-container flex items-center justify-center mb-md shadow-sm">
                    <span class="material-symbols-outlined text-[28px]"
                        style="font-variation-settings: 'FILL' 1;">inventory_2</span>
                </div>
                <h1 class="font-h1 text-h1 text-text-primary mb-xs">JuraganTitip</h1>
                <p class="font-body text-body text-text-secondary">Sistem Manajemen Konsinyasi Terpadu</p>
            </div>
            <!-- Form -->
            <form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
                <!-- Email Input -->
                <div class="flex flex-col gap-xs">
                    <label class="font-data-md text-data-md text-text-primary" for="email">Email</label>
                    <div class="relative flex items-center">
                        <span
                            class="material-symbols-outlined absolute left-md text-text-secondary text-[20px]">mail</span>
                        <input
                            class="w-full pl-10 pr-md py-2 bg-surface border border-outline-variant rounded-lg font-body text-body text-on-surface placeholder:text-text-muted focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all shadow-sm"
                            id="email" placeholder="nama@perusahaan.com" type="email" />
                    </div>
                </div>
                <!-- Password Input -->
                <div class="flex flex-col gap-xs">
                    <label class="font-data-md text-data-md text-text-primary" for="password">Password</label>
                    <div class="relative flex items-center">
                        <span
                            class="material-symbols-outlined absolute left-md text-text-secondary text-[20px]">lock</span>
                        <input
                            class="w-full pl-10 pr-10 py-2 bg-surface border border-outline-variant rounded-lg font-body text-body text-on-surface placeholder:text-text-muted focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all shadow-sm"
                            id="password" placeholder="••••••••" type="password" />
                        <button
                            class="absolute right-md text-text-secondary hover:text-text-primary transition-colors focus:outline-none flex items-center justify-center"
                            type="button">
                            <span class="material-symbols-outlined text-[20px]">visibility_off</span>
                        </button>
                    </div>
                    <div class="flex justify-end mt-1">
                        <a class="font-caption text-caption text-primary-container hover:underline focus:outline-none"
                            href="#">Lupa password?</a>
                    </div>
                </div>
                <!-- Primary Action -->
                <button
                    class="mt-sm w-full py-2.5 bg-primary-container text-on-primary-container font-h3 text-h3 rounded-lg shadow-sm hover:opacity-90 active:scale-[0.97] transition-all duration-100 flex items-center justify-center gap-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container"
                    type="submit">
                    Masuk
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
            </form>
            <!-- Footer Link -->
            <div class="text-center mt-xs pt-md border-t border-outline-variant border-opacity-50">
                <p class="font-body-sm text-body-sm text-text-secondary">
                    Belum punya akun?
                    <a class="text-primary-container font-data-md hover:underline focus:outline-none" href="#">Daftar di
                        sini</a>
                </p>
            </div>
        </div>
    </main>
    <script>
        // Simple password toggle logic for the prototype
        const toggleBtn = document.querySelector('button[type="button"]');
        const passwordInput = document.getElementById('password');
        const toggleIcon = toggleBtn.querySelector('.material-symbols-outlined');

        toggleBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility_off';
            }
        });
    </script>
</body>

</html>
