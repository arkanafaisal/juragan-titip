<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>

<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-md antialiased text-on-surface">
<main class="w-full max-w-[420px] w-full animate-fade-in-up">
<div class="text-center mb-8"><div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-primary-container text-primary mb-md shadow-sm">
<span class="material-symbols-outlined" style="font-size: 28px; font-variation-settings: 'FILL' 1;">inventory_2</span>
</div>
<h1 class="font-h1 text-h1 text-primary tracking-tight">JuraganTitip</h1>
<p class="font-body-sm text-body-sm text-text-secondary mt-1">Sistem Manajemen Konsinyasi Terpadu</p></div>
<div class="bg-surface rounded-xl shadow-lg border border-outline-variant/30 p-8">
<div class="mb-md">
<h2 class="font-h2 text-h2 text-on-surface">Daftar Akun</h2>
<p class="font-body-sm text-body-sm text-text-secondary mt-xs">Lengkapi formulir di bawah ini untuk memulai.</p>
</div>
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-xs relative">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium" for="fullname">Nama Lengkap</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[18px]">person</span>
<input class="w-full h-10 pl-10 pr-md rounded-lg border border-outline-variant bg-surface font-body text-body text-text-primary placeholder:text-text-muted focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all duration-200" id="fullname" placeholder="Masukkan nama lengkap Anda" type="text">
</div>
</div>
<div class="flex flex-col gap-xs relative">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium" for="email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[18px]">mail</span>
<input class="w-full h-10 pl-10 pr-md rounded-lg border border-outline-variant bg-surface font-body text-body text-text-primary placeholder:text-text-muted focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all duration-200" id="email" placeholder="contoh@perusahaan.com" type="email">
</div>
</div>
<div class="flex flex-col gap-xs relative">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium" for="phone">Nomor Telepon</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[18px]">phone_iphone</span>
<input class="w-full h-10 pl-10 pr-md rounded-lg border border-outline-variant bg-surface font-body text-body text-text-primary placeholder:text-text-muted focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all duration-200" id="phone" placeholder="08xx xxxx xxxx" type="tel">
</div>
</div>
<div class="flex flex-col gap-xs relative">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium" for="password">Kata Sandi</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[18px]">lock</span>
<input class="w-full h-10 pl-10 pr-10 rounded-lg border border-outline-variant bg-surface font-body text-body text-text-primary placeholder:text-text-muted focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all duration-200" id="password" placeholder="Minimal 8 karakter" type="password">
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[18px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col gap-xs relative">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium" for="confirm_password">Konfirmasi Kata Sandi</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[18px]">lock_reset</span>
<input class="w-full h-10 pl-10 pr-10 rounded-lg border border-outline-variant bg-surface font-body text-body text-text-primary placeholder:text-text-muted focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all duration-200" id="confirm_password" placeholder="Ulangi kata sandi" type="password">
</div>
</div>
<div class="mt-sm">
<button class="w-full h-10 bg-primary text-on-primary font-body text-body font-semibold rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-xs group" type="submit">Daftar Sekarang
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-0.5">arrow_forward</span></button>
</div>
</form>
</div>
<div class="text-center mt-md mb-8">
<p class="font-body-sm text-body-sm text-text-secondary">
                Sudah punya akun? 
                <a class="text-primary font-semibold hover:underline transition-all" href="#">Masuk</a>
</p>
</div>
</main>
<style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
    </style>
